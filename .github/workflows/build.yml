name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: web_ui.h matches web/
        run: python3 tools/embed_web.py --check

  firmware:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32-wroom-32
            fqbn: esp32:esp32:esp32
          - board: xiao-esp32c6
            fqbn: esp32:esp32:XIAO_ESP32C6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile for ${{ matrix.board }}
        run: arduino-cli compile --fqbn ${{ matrix.fqbn }} --output-dir out iUART
      - name: Name the firmware
        run: cp out/iUART.ino.merged.bin iuart-${{ matrix.board }}.bin
      - uses: actions/upload-artifact@v7
        with:
          name: iuart-${{ matrix.board }}
          path: iuart-${{ matrix.board }}.bin
